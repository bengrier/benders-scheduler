<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benders Availability — C2 Division</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🏒</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-main">
    <h1>Benders Availability</h1>
    <p class="subtitle" id="season-line">C2 Division</p>
    <p class="sync-pill" id="sync-pill" data-state="off"><span class="dot"></span><span id="sync-text">Local only</span></p>
  </div>
</header>

<section class="controls">
  <label class="field">
    <span class="field-label">Filter players</span>
    <input type="search" id="filter-players" placeholder="Type a name…" autocomplete="off">
  </label>

  <label class="field">
    <span class="field-label">Games</span>
    <select id="game-scope">
      <option value="upcoming">Benders — upcoming</option>
      <option value="benders">Benders — full season</option>
      <option value="all">Every C2 game</option>
    </select>
  </label>

  <div class="field field-inline">
    <label class="check"><input type="checkbox" id="toggle-mine"> Only my column</label>
  </div>

  <p class="hint">Click a cell to cycle <b class="k k-in">In</b> → <b class="k k-out">Out</b> → <b class="k k-maybe">Maybe</b> → blank. <span id="hint-storage">Everything saves in this browser.</span></p>
</section>

<main>
  <div class="grid-wrap" id="grid-wrap">
    <table class="grid" id="grid"></table>
  </div>
  <p class="empty" id="empty-msg" hidden></p>
</main>

<footer class="footer">
  <span id="footer-stats"></span>
  <span class="footer-note" id="footer-note"><a href="https://github.com/bengrier/benders-scheduler">source</a></span>
</footer>

<div class="toast" id="toast" hidden></div>

<script src="data/data.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
